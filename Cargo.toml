[package]
name = "bitfun_grep"
version = "0.1.0"
edition = "2021"

[dependencies]
aho-corasick = "1.1.4"
clap = { version = "4.5.20", features = ["derive"] }
crc32fast = "1.4.2"
grep-matcher = { path = "/home/wgq/workspace/ripgrep/crates/matcher" }
grep-regex = { path = "/home/wgq/workspace/ripgrep/crates/regex" }
grep-searcher = { path = "/home/wgq/workspace/ripgrep/crates/searcher" }
ignore = "0.4.23"
libc = "0.2.177"
memchr = "2.7.4"
memmap2 = "0.9.5"
rayon = "1.10.0"
regex = "1.11.1"
regex-automata = "0.4.14"
regex-syntax = "0.8.10"
thiserror = "2.0.11"
walkdir = "2.5.0"

[dev-dependencies]
serde_json = "1.0.145"
tempfile = "3.14.0"

[lints.clippy]
all = { level = "warn", priority = -1 }
bool_to_int_with_if = "warn"
dbg_macro = "warn"
expect_used = "warn"
map_unwrap_or = "warn"
match_same_arms = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
todo = "warn"
unimplemented = "warn"
unnested_or_patterns = "warn"
unnecessary_wraps = "warn"
unwrap_used = "warn"
