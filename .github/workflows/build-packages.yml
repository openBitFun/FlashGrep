name: build-packages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - label: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - label: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - label: windows-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - label: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - label: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Rust toolchain
        shell: pwsh
        run: |
          rustc -V
          cargo -V
          rustup -V

      - name: Ensure target toolchain
        shell: pwsh
        run: rustup target add ${{ matrix.target }}

      - name: Build release binary
        shell: pwsh
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package distribution
        shell: pwsh
        run: ./scripts/package-dist.ps1 -Target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashgrep-${{ matrix.target }}
          path: dist/flashgrep-${{ matrix.target }}.*
          if-no-files-found: error

  publish-release:
    name: publish-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: flashgrep-*
          merge-multiple: true

      - name: Publish GitHub release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG_NAME" --repo "$GH_REPO" >/dev/null 2>&1 \
            || gh release create "$TAG_NAME" --repo "$GH_REPO" --verify-tag --generate-notes
          gh release upload "$TAG_NAME" release-assets/* --repo "$GH_REPO" --clobber
